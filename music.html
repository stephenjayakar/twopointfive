<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>twopointsix score</title>
  <link rel="icon" href="data:," />
  <style>
    /* THE SCORE'S LISTENING PAGE (src/music/main.ts): every piece of the score on one row, played by the game's own sequencer and voices, the tension under one slider, a keep / cut mark per piece; under them the levels, each with the two pieces written down for it (audio/setlist.ts), to hear and to change.
       One column of rows under a sticky bar that holds the slider and a spectrum; the game's HUD dress (sounds.html's tokens): thin green mono on near-black, one look on any host. */
    :root { --bg: #05090a; --panel: #0a1214; --row: #0c1719; --line: rgba(120,170,160,0.22); --ink: #cfeee2; --dim: #7f9a92; --lit: #8ff0b4; --gold: #f2cf6b; --red: #ff7a6a; --on: #041008;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color-scheme: dark; }
    html { background: var(--bg); }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--mono); }
    button, input, textarea { font: inherit; color: var(--ink); }
    button { background: rgba(120,170,160,0.10); border: 1px solid var(--line); border-radius: 3px; padding: 4px 10px; cursor: pointer; }
    button:hover { border-color: rgba(143,240,180,0.6); }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--lit); outline-offset: 1px; }
    #bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
    #bar .in, main { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    #bar .in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; }
    h1 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--lit); }
    #tense { flex: 1 1 260px; display: flex; align-items: center; gap: 10px; color: var(--dim); min-width: 0; }
    #tension { flex: 1; min-width: 0; accent-color: var(--lit); }
    #scope { display: block; width: 100%; height: 44px; color: var(--lit); opacity: 0.85; }
    main { padding-block: 14px 60px; display: flex; flex-direction: column; gap: 14px; }
    #list { display: flex; flex-direction: column; gap: 2px; }
    .row { display: grid; grid-template-columns: 40px minmax(0, 1fr) minmax(0, 1.3fr) auto; align-items: center; gap: 4px 12px; padding: 7px 8px; background: var(--row); border: 1px solid transparent; border-radius: 3px; }
    .row.playing { border-color: rgba(143,240,180,0.45); }
    .row.playing .name { color: var(--lit); }
    .play { width: 40px; height: 32px; padding: 0; color: var(--lit); font-size: 12px; }
    .play[aria-pressed="true"] { background: var(--lit); border-color: var(--lit); color: var(--on); }
    .name { font-size: 14px; overflow-wrap: anywhere; }
    .meta { color: var(--dim); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .marks { display: flex; gap: 4px; }
    .mark { color: var(--dim); padding: 3px 9px; }
    .mark[aria-pressed="true"][data-mark="keep"] { background: var(--lit); border-color: var(--lit); color: var(--on); font-weight: 600; }
    .mark[aria-pressed="true"][data-mark="cut"] { background: var(--red); border-color: var(--red); color: var(--on); font-weight: 600; }
    h2 { margin: 10px 0 -6px; font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }
    #levels { display: flex; flex-direction: column; gap: 2px; }
    .lrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) minmax(0, 1.1fr); align-items: center; gap: 4px 12px; padding: 5px 8px; background: var(--row); border: 1px solid transparent; border-radius: 3px; }
    .lrow.mine { border-color: rgba(242,207,107,0.5); }
    .slot { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .slot .play { flex: none; width: 32px; height: 28px; }
    select { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; }
    select:focus-visible { outline: 2px solid var(--lit); outline-offset: 1px; }
    #foot { display: flex; align-items: center; gap: 10px; }
    #copy { background: var(--gold); border-color: var(--gold); color: var(--on); font-weight: 600; }
    #out { flex: 1; min-width: 0; height: 2.6em; background: var(--row); border: 1px solid var(--line); border-radius: 3px; padding: 4px 6px; resize: none; }
    @media (max-width: 560px) { .row { grid-template-columns: 40px minmax(0, 1fr) auto; } .meta { grid-column: 2 / -1; grid-row: 2; } .lrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .lrow .name { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <div id="bar"><div class="in">
    <h1>Score</h1>
    <label id="tense">calm <input id="tension" type="range" min="0" max="1" step="0.01" value="0" aria-label="Tension" /> firefight</label>
  </div></div>
  <main>
    <canvas id="scope" aria-hidden="true"></canvas>
    <div id="list"></div>
    <h2>Levels</h2>
    <div id="levels"></div>
    <div id="foot"><button id="copy" type="button" hidden>copy marks</button><textarea id="out" hidden readonly aria-label="Your marks, to paste back"></textarea></div>
  </main>
  <script type="module" src="./src/music/main.ts"></script>
</body>
</html>
